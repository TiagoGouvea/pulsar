project:
  id: example-project
  workspace: ./fixtures/demo-workspace
  specs:
    - ./fixtures/demo-inputs/specification.md
  milestones:
    - id: 0-setup
      title: Etapa 0 — Setup
      objective: Fundação verificável do projeto.
  designDirectory: ./fixtures/demo-inputs/design
  profile: react-firebase
  timezone: America/Sao_Paulo

execution:
  executor: fake
  maxConcurrentTasks: 1
  maxConcurrentLocalRequests: 1
  maxAttemptsPerTask: 4
  maxSameFailureCount: 2
  taskTimeoutMinutes: 30
  implementationTimeoutMinutes: 15
  reviewTimeoutMinutes: 2
  staleHeartbeatSeconds: 90
  humanGate: every_milestone
  allowProductionDeploy: false
  continueWhileAwaitingHuman: false
  allowBranchSwitch: false

budget:
  currency: USD
  projectLimit: null
  dailyLimit: null
  milestoneLimit: null
  milestoneLimits: {}
  taskLimit: null
  diagnosticsLimit: null
  finalVerificationReservePercent: 20
  warningThresholds: [50, 75, 90]
  automaticTopUp: false
  unknownCostPolicy: block_paid_calls

localInference:
  baseUrl: http://localhost:1235/v1
  maxLoadedModels: 1
  initialContextTokens: 8192
  maxOutputTokens: 2048
  memoryPressureAction: unload_and_route_or_pause

review:
  requireIndependentSession: true
  preferDifferentModelFamily: true
  maxAttempts: 3
  viewportWidths: [390, 430, 1440]

commands:
  install: [yarn, install, --immutable]
  dev: [yarn, dev]
  typecheck: [yarn, typecheck]
  lint: [yarn, lint]
  test: [yarn, test]
  build: [yarn, build]
  e2e: [yarn, test:e2e]

models:
  - alias: fake-local
    executor: fake
    provider: fake
    modelId: deterministic-v1
    family: deterministic
    modality: local
    capabilities: [text, tools, structured_output]
    roles: [planner, implementer, testAuthor, diagnostic, functionalReviewer, securityReviewer, learningAnalyst]
    enabled: true
    contextTokens: 8192
    maxOutputTokens: 2048

  - alias: local-qwen-9b
    executor: pi
    provider: lmstudio
    modelId: qwen3.5-9b-mlx
    endpoint: http://localhost:1235/v1
    family: qwen3.5
    modality: local
    capabilities: [text, tools, reasoning]
    roles: [planner, implementer, testAuthor, diagnostic, learningAnalyst]
    enabled: true
    contextTokens: 8192
    maxOutputTokens: 2048

  - alias: local-qwen-coder
    executor: pi
    provider: lmstudio
    modelId: qwen3-coder-30b-a3b-instruct
    endpoint: http://localhost:1235/v1
    family: qwen3-coder
    modality: local
    capabilities: [text, tools, reasoning]
    roles: [implementer, testAuthor, diagnostic]
    enabled: true
    contextTokens: 8192
    maxOutputTokens: 2048

  - alias: local-gpt-oss
    executor: pi
    provider: lmstudio
    modelId: mlx-community/gpt-oss-20b
    endpoint: http://localhost:1235/v1
    family: gpt-oss
    modality: local
    capabilities: [text, tools, reasoning]
    roles: [planner, diagnostic, functionalReviewer, visualReviewer, securityReviewer, learningAnalyst]
    enabled: true
    contextTokens: 8192
    maxOutputTokens: 2048

storage:
  root: ./.harness
  retentionDays: 30

dashboard:
  host: 127.0.0.1
  port: 4317

security:
  allowedCommands: [yarn, node, git, rg, npx]
  trustMode: workspace_process
  redactPatterns: []
