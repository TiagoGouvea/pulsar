<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus itens</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Meus itens</h1>
    <form id="item-form">
      <label for="title">Novo item</label>
      <div class="row"><input id="title" autocomplete="off"><button>Adicionar</button></div>
      <p id="error" role="alert"></p>
    </form>
    <label for="filter">Buscar</label>
    <input id="filter" type="search" placeholder="Filtrar itens">
    <ul id="items" aria-live="polite"></ul>
    <p id="empty">Nenhum item cadastrado.</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
