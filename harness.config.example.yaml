project:
  id: example-project
  workspace: ./fixtures/demo-workspace
  specs:
    - ./fixtures/demo-inputs/specification.md
  designDirectory: ./fixtures/demo-inputs/design
  profile: react-firebase
  timezone: America/Sao_Paulo

execution:
  executor: fake
  maxConcurrentTasks: 1
  maxConcurrentLocalRequests: 1
  maxAttemptsPerTask: 3
  maxSameFailureCount: 2
  taskTimeoutMinutes: 30
  staleHeartbeatSeconds: 90
  humanGate: every_milestone
  allowProductionDeploy: false
  continueWhileAwaitingHuman: false

budget:
  currency: USD
  projectLimit: null
  dailyLimit: null
  milestoneLimit: null
  taskLimit: null
  diagnosticsLimit: null
  finalVerificationReservePercent: 20
  warningThresholds: [50, 75, 90]
  automaticTopUp: false
  unknownCostPolicy: block_paid_calls

localInference:
  baseUrl: http://127.0.0.1:1234
  maxLoadedModels: 1
  initialContextTokens: 8192
  maxOutputTokens: 2048
  memoryPressureAction: unload_and_route_or_pause

review:
  requireIndependentSession: true
  preferDifferentModelFamily: true
  viewportWidths: [390, 768, 1440]

commands:
  install: [yarn, install, --immutable]
  dev: [yarn, dev]
  typecheck: [yarn, typecheck]
  lint: [yarn, lint]
  test: [yarn, test]
  build: [yarn, build]
  e2e: [yarn, test:e2e]

models:
  - alias: fake-local
    executor: fake
    provider: fake
    modelId: deterministic-v1
    family: deterministic
    modality: local
    capabilities: [text, tools, structured_output]
    roles: [planner, implementer, testAuthor, diagnostic, functionalReviewer, securityReviewer, learningAnalyst]
    enabled: true
    contextTokens: 8192
    maxOutputTokens: 2048

storage:
  root: ./.harness
  retentionDays: 30

dashboard:
  host: 127.0.0.1
  port: 4317

security:
  allowedCommands: [yarn, node, git, rg, npx]
  trustMode: workspace_process
  redactPatterns: []
