currency: USD
caps:
  run: 68             # projeto inteiro (soma de byStage = 68)
  stage: 6            # padrão para etapas sem valor em byStage
  byStage:            # por etapa (id em harness.config.yaml > stages); opcionais fora do escopo não gastam
    "0": 16           # Setup: inicializador (opus), scaffold, design system (1ª rodada sozinha custou US$ 4,71)
    "1": 10           # Base: auth, security rules (implement_hard)
    "2": 9            # Registro
    "3": 12           # Insights: estatística (implement_hard)
    "4": 5            # Curadoria
    "5": 6            # PWA e push
    "6": 4            # IA generativa
    "7": 6            # Polimento
  feature: 3          # por feature (todas as tentativas + reviews)
  dailyByProvider:
    anthropic: 20
    openai: 15
    google: 10
    openrouter: 10
alerts: [0.5, 0.8, 1.0]
onSoftLimit: prefer_cheap    # >= 80%: router prioriza low/local
onHardLimit: pause_and_checkpoint
# Limites duros externos (configure nos consoles; o doctor só lembra):
# - OpenRouter: guardrail por chave com reset diário
# - Anthropic / OpenAI: limite mensal no console
# - Google Cloud: alertas de orçamento (não bloqueiam)
